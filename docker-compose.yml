name: portfolio-blog

services:
  app:
    build:
      context: .
      dockerfile: dockerfile
    image: portfolio-blog:latest
    container_name: portfolio-blog
    entrypoint: ["sh", "/app/entrypoint.sh"]
    command: python manage.py runserver 0.0.0.0:8000
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    environment:
      DJANGO_SETTINGS_MODULE: ${DJANGO_SETTINGS_MODULE:-config.settings.local}
      DB_ENGINE: ${DB_ENGINE:-django.db.backends.postgresql}
      DB_NAME: ${DB_NAME:-portfolio_blog_db}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-password}
      DB_HOST: ${DB_HOST:-db}
      DB_PORT: ${DB_PORT:-5432}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1,app,portfolio-blog}
      DEBUG: ${DEBUG:-True}
    # depends_on:
    #   db:
    #     condition: service_healthy
    networks:
      - portfolio_network
  #db:  # Local Postgres (commented out when using external DB like Neon)
  #  image: postgres:16-alpine
  #  container_name: postgress-db
  #  restart: always
  #  environment:
  #    POSTGRES_USER: ${POSTGRES_USER:-postgres}
  #    POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
  #    POSTGRES_DB: ${POSTGRES_DB:-portfolio_blog_db}
  #  volumes:
  #    - db_data:/var/lib/postgresql/data
  #  networks:
  #    - portfolio_network
  #  healthcheck:
  #    test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
  #    interval: 5s
  #    timeout: 5s
  #    retries: 10

networks:
  portfolio_network:
    driver: bridge

volumes: {}

