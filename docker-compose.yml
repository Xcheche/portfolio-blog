name: portfolio-blog

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: portfolio-blog:latest
    container_name: portfolio-blog
    entrypoint: ["sh", "/app/entrypoint.sh"]
    command: python manage.py runserver 0.0.0.0:8000
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    environment:
      DEBUG: "True"
      EMAIL_BACKEND: django.core.mail.backends.smtp.EmailBackend
      EMAIL_HOST: mailpit
      EMAIL_PORT: ${EMAIL_PORT:-1025}
      EMAIL_USE_TLS: ${EMAIL_USE_TLS:-False}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1,app,portfolio-blog}

  mailpit:
    image: axllent/mailpit:latest
    container_name: mailpit
    ports:
      - "1025:1025"
      - "8025:8025"

networks:
  default:
    name: portfolio_network

volumes: {}



