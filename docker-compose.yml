name: portfolio-blog

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: portfolio-blog:latest
    container_name: portfolio-blog
    entrypoint: ["sh", "/app/entrypoint.sh"]
    command: gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 4
    ports:
      - "8000:8000"
    # volumes:
    #   - .:/app
    environment:
      DEBUG: ${DEBUG:-False}
      EMAIL_BACKEND: ${EMAIL_BACKEND:-django.core.mail.backends.smtp.EmailBackend}
      # Default to Gmail SMTP; override via .env if needed
      EMAIL_HOST: ${EMAIL_HOST:-smtp.gmail.com}
      EMAIL_PORT: ${EMAIL_PORT:-587}
      EMAIL_USE_TLS: ${EMAIL_USE_TLS:-True}
      EMAIL_HOST_USER: ${EMAIL_HOST_USER:-}
      EMAIL_HOST_PASSWORD: ${EMAIL_HOST_PASSWORD:-}
      DEFAULT_FROM_EMAIL: ${DEFAULT_FROM_EMAIL:-xcheche31@gmail.com}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1,app,portfolio-blog}

  # mailpit:
  #   image: axllent/mailpit:latest
  #   container_name: mailpit
  #   ports:
  #     - "1025:1025"
  #     - "8025:8025"

networks:
  default:
    name: portfolio_network

volumes: {}



